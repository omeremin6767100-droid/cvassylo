<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cvassylo - Pixel Side-Scroll Co-op Universe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        header {
            width: 100%;
            background-color: #0f1016;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1e1b4b;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(56,189,248,0.5);
        }

        .logo span {
            color: #f43f5e;
        }

        .mode-container {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            background-color: #1e1b4b;
            color: #cbd5e1;
            border: 2px solid #312e81;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .mode-btn.active, .mode-btn:hover {
            background-color: #38bdf8;
            color: #050508;
            border-color: #7dd3fc;
            box-shadow: 0 0 12px rgba(56,189,248,0.6);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            background: radial-gradient(circle at center, #0f1016 0%, #050508 100%);
        }

        canvas {
            background-color: #09090e;
            display: block;
            border: 4px solid #1e1b4b;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 24px;
            background: rgba(10, 10, 15, 0.9);
            padding: 12px 18px;
            border: 2px solid #312e81;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .dialogue-box {
            position: absolute;
            bottom: 30px;
            width: 800px;
            background: rgba(10, 10, 15, 0.95);
            border: 4px solid #38bdf8;
            border-radius: 8px;
            padding: 20px;
            font-size: 16px;
            color: #f8fafc;
            display: none;
            box-shadow: 0 0 30px rgba(56,189,248,0.3);
            z-index: 200;
        }

        .controls-hint {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">cvassylo<span>.</span>side</div>
        <div class="mode-container">
            <button class="mode-btn active" onclick="switchMode(1)">1. Açık Dünya</button>
            <button class="mode-btn" onclick="switchMode(2)">2. NPC Kaçış</button>
            <button class="mode-btn" onclick="switchMode(3)">3. Yükselen Lav</button>
            <button class="mode-btn" onclick="switchMode(4)">4. Altın Avı</button>
            <button class="mode-btn" onclick="switchMode(5)">5. Zombi Kuşatması</button>
        </div>
    </header>

    <main>
        <div class="hud-overlay" id="hud">Mod: Açık Dünya (Yandan Görünüm)<br>P1 Can: ❤️❤️❤️ | P2 Can: ❤️❤️❤️</div>
        <canvas id="gameCanvas" width="1024" height="576"></canvas>
        <div class="dialogue-box" id="dialogueBox"></div>
        <div class="controls-hint">P1: WASD + Space + F (Araca Bin) | P2: Yön Tuşları + G (Araca Bin)</div>
    </main>

    <script>
        // ==========================================
        // WEB AUDIO API - RETRO SOUND SYNTHESIZER
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(900, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'car') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        // ==========================================
        // CANVAS & GAME SETUP
        // ==========================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        const WORLD_WIDTH = 4000;
        const WORLD_HEIGHT = 1200;
        const GRAVITY = 0.55;

        let gameMode = 1;
        let gameTime = 0;
        let lavaY = WORLD_HEIGHT + 200;

        // Input handler
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') { e.preventDefault(); }
            if (e.code === 'KeyF') interactVehicle(p1);
            if (e.code === 'KeyG') interactVehicle(p2);
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        // ==========================================
        // ENTITIES (PLAYERS, VEHICLES, PLATFORMS)
        // ==========================================
        const p1 = {
            x: 200, y: 900, w: 24, h: 36, vx: 0, vy: 0, 
            speed: 4, jumpForce: -12, grounded: false, color: '#38bdf8', 
            hp: 3, inVehicle: null, facing: 1, name: 'P1'
        };

        const p2 = {
            x: 250, y: 900, w: 24, h: 36, vx: 0, vy: 0, 
            speed: 4, jumpForce: -12, grounded: false, color: '#10b981', 
            hp: 3, inVehicle: null, facing: 1, name: 'P2'
        };

        // Platforms & World Geometry (Side-Scroll Terrain with High Areas & Buildings)
        const platforms = [];
        // Ground floor
        platforms.push({ x: 0, y: 1000, w: WORLD_WIDTH, h: 200, type: 'ground', color: '#1e1b4b' });

        // Multilevel Platforms, Skyscrapers & Rooftops
        for (let i = 400; i < WORLD_WIDTH - 300; i += 450) {
            let bWidth = 280;
            let bHeight = 350 + (i % 3) * 120;
            // Building
            platforms.push({ x: i, y: 1000 - bHeight, w: bWidth, h: bHeight, type: 'building', color: '#0f172a', trim: '#312e81' });
            
            // Connecting floating platforms & ladders
            platforms.push({ x: i - 100, y: 1000 - bHeight - 120, w: 140, h: 20, type: 'platform', color: '#334155' });
            platforms.push({ x: i + bWidth - 40, y: 1000 - bHeight - 220, w: 160, h: 20, type: 'platform', color: '#334155' });
        }

        // Extra floating platforms high in the sky
        for (let i = 200; i < WORLD_WIDTH; i += 300) {
            platforms.push({ x: i, y: 350 + (i % 200), w: 180, h: 20, type: 'platform', color: '#475569' });
        }

        // Vehicles (Side-view cars)
        const vehicles = [
            { x: 600, y: 960, w: 70, h: 35, vx: 0, speed: 6, color: '#f43f5e', driver: null },
            { x: 1800, y: 960, w: 70, h: 35, vx: 0, speed: 6, color: '#eab308', driver: null },
            { x: 2800, y: 960, w: 70, h: 35, vx: 0, speed: 6, color: '#a855f7', driver: null }
        ];

        // NPCs & Enemies
        const entities = [];
        for (let i = 0; i < 25; i++) {
            entities.push({
                x: 500 + i * 150,
                y: 960,
                w: 24,
                h: 36,
                vx: (Math.random() - 0.5) * 2,
                type: (i % 2 === 0) ? 'npc' : 'enemy',
                dialogue: "Merhaba yolcu! cvassylo şehrine hoş geldin.",
                hp: 2
            });
        }

        // Collectibles / Gold bags
        const coins = [];
        for (let i = 300; i < WORLD_WIDTH - 200; i += 220) {
            coins.push({ x: i, y: 400 + (i % 400), collected: false });
        }

        // ==========================================
        // GAME MODES & SYSTEM FUNCTIONS
        // ==========================================
        function switchMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
                if (idx + 1 === mode) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (mode === 3) lavaY = WORLD_HEIGHT + 200;
            const titles = ["Açık Dünya", "NPC Kaçış", "Yükselen Lav", "Altın Avı", "Zombi Kuşatması"];
            updateHUD();
        }

        function updateHUD() {
            let titles = ["Açık Dünya", "NPC Kaçış", "Yükselen Lav", "Altın Avı", "Zombi Kuşatması"];
            document.getElementById('hud').innerHTML = `Mod: ${titles[gameMode-1]} (Yandan Görünüm)<br>P1 Can: ${'❤️'.repeat(Math.max(0,p1.hp))} | P2 Can: ${'❤️'.repeat(Math.max(0,p2.hp))}`;
        }

        function interactVehicle(player) {
            if (player.inVehicle) {
                // Exit vehicle
                player.x = player.inVehicle.x + 80;
                player.y = player.inVehicle.y;
                player.inVehicle.driver = null;
                player.inVehicle = null;
            } else {
                vehicles.forEach(v => {
                    if (!v.driver && Math.hypot(v.x - player.x, v.y - player.y) < 60) {
                        v.driver = player;
                        player.inVehicle = v;
                        playSound('car');
                    }
                });
            }
        }

        // ==========================================
        // PHYSICS & COLLISION ENGINE
        // ==========================================
        function rectIntersect(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        function updatePlayer(p, leftKey, rightKey, jumpKey) {
            if (p.inVehicle) {
                let v = p.inVehicle;
                if (keys[leftKey]) { v.x -= v.speed; v.facing = -1; playSound('car'); }
                if (keys[rightKey]) { v.x += v.speed; v.facing = 1; playSound('car'); }
                p.x = v.x + v.w / 2;
                p.y = v.y - 10;
                return;
            }

            // Horizontal movement
            p.vx = 0;
            if (keys[leftKey]) { p.vx = -p.speed; p.facing = -1; }
            if (keys[rightKey]) { p.vx = p.speed; p.facing = 1; }

            p.x += p.vx;
            // Wall collisions (X axis)
            platforms.forEach(plat => {
                if (rectIntersect(p, plat)) {
                    if (p.vx > 0) p.x = plat.x - p.w;
                    else if (p.vx < 0) p.x = plat.x + plat.w;
                }
            });

            // Vertical movement & gravity
            p.vy += GRAVITY;
            p.y += p.vy;
            p.grounded = false;

            // Platform collisions (Y axis)
            platforms.forEach(plat => {
                if (rectIntersect(p, plat)) {
                    if (p.vy > 0) { // Landing
                        p.y = plat.y - p.h;
                        p.vy = 0;
                        p.grounded = true;
                    } else if (p.vy < 0) { // Hitting ceiling
                        p.y = plat.y + plat.h;
                        p.vy = 0;
                    }
                }
            });

            if (keys[jumpKey] && p.grounded) {
                p.vy = p.jumpForce;
                p.grounded = false;
                playSound('jump');
            }

            // Boundaries
            if (p.x < 0) p.x = 0;
            if (p.x > WORLD_WIDTH - p.w) p.x = WORLD_WIDTH - p.w;
            if (p.y > WORLD_HEIGHT) {
                p.hp--;
                p.y = 800;
                p.x = 200;
                playSound('hit');
                updateHUD();
            }
        }

        // ==========================================
        // GAME LOOP UPDATE
        // ==========================================
        function update() {
            gameTime++;

            // Mode 3: Rising Lava
            if (gameMode === 3) {
                lavaY -= 0.35;
                if (p1.y > lavaY) { p1.hp--; p1.y = 300; playSound('hit'); updateHUD(); }
                if (p2.y > lavaY) { p2.hp--; p2.y = 300; playSound('hit'); updateHUD(); }
            }

            // Update Players (P1: WASD + Space, P2: Arrows + Up)
            updatePlayer(p1, 'KeyA', 'KeyD', 'Space');
            updatePlayer(p2, 'ArrowLeft', 'ArrowRight', 'ArrowUp');

            // Entities / NPCs / Zombies AI
            entities.forEach(en => {
                en.x += en.vx;
                if (en.x < 100 || en.x > WORLD_WIDTH - 100) en.vx *= -1;

                if (gameMode === 2 || gameMode === 5) {
                    let target = Math.hypot(p1.x - en.x, p1.y - en.y) < Math.hypot(p2.x - en.x, p2.y - en.y) ? p1 : p2;
                    if (en.x < target.x) en.x += 1.2;
                    else en.x -= 1.2;

                    // Damage check
                    if (rectIntersect(p1, en)) { p1.hp -= 0.05; updateHUD(); }
                    if (rectIntersect(p2, en)) { p2.hp -= 0.05; updateHUD(); }
                }
            });

            // Coins / Gold Collection (Mode 4)
            coins.forEach(c => {
                if (!c.collected) {
                    if (Math.hypot(p1.x - c.x, p1.y - c.y) < 25 || Math.hypot(p2.x - c.x, p2.y - c.y) < 25) {
                        c.collected = true;
                        playSound('coin');
                    }
                }
            });
        }

        // ==========================================
        // RENDER ENGINE (PIXEL ART / UNDERTALE VIBE)
        // ==========================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Camera tracking (Center between P1 & P2)
            let camX = (p1.x + p2.x) / 2 - canvas.width / 2;
            let camY = (p1.y + p2.y) / 2 - canvas.height / 2;

            camX = Math.max(0, Math.min(camX, WORLD_WIDTH - canvas.width));
            camY = Math.max(0, Math.min(camY, WORLD_HEIGHT - canvas.height));

            ctx.save();
            ctx.translate(-camX, -camY);

            // Background Starry Retro Sky
            ctx.fillStyle = '#050508';
            ctx.fillRect(camX, camY, canvas.width, canvas.height);

            // Draw Platforms & Skyscrapers
            platforms.forEach(plat => {
                ctx.fillStyle = plat.color;
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                if (plat.trim) {
                    ctx.fillStyle = plat.trim;
                    ctx.fillRect(plat.x, plat.y, plat.w, 10);
                }
            });

            // Draw Coins
            if (gameMode === 4) {
                ctx.fillStyle = '#facc15';
                coins.forEach(c => {
                    if (!c.collected) {
                        ctx.fillRect(c.x - 6, c.y - 6, 12, 12);
                        ctx.fillStyle = '#fef08a';
                        ctx.fillRect(c.x - 3, c.y - 3, 6, 6);
                        ctx.fillStyle = '#facc15';
                    }
                });
            }

            // Draw Vehicles
            vehicles.forEach(v => {
                ctx.fillStyle = v.color;
                ctx.fillRect(v.x, v.y, v.w, v.h);
                ctx.fillStyle = '#1e293b'; // Windshield
                ctx.fillRect(v.x + 15, v.y - 10, 30, 12);
                // Wheels
                ctx.fillStyle = '#000';
                ctx.fillRect(v.x + 8, v.y + v.h - 4, 12, 10);
                ctx.fillRect(v.x + v.w - 20, v.y + v.h - 4, 12, 10);
            });

            // Draw Entities / NPCs
            entities.forEach(en => {
                ctx.fillStyle = (gameMode === 5) ? '#22c55e' : '#cbd5e1';
                ctx.fillRect(en.x, en.y, en.w, en.h);
                ctx.fillStyle = '#000'; // Eyes
                ctx.fillRect(en.x + 6, en.y + 8, 4, 4);
                ctx.fillRect(en.x + 14, en.y + 8, 4, 4);
            });

            // Draw Player 1 (Undertale Blue Soul Vibe)
            if (!p1.inVehicle) {
                ctx.fillStyle = p1.color;
                ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
                ctx.fillStyle = '#fff'; // Face details
                ctx.fillRect(p1.x + (p1.facing > 0 ? 14 : 4), p1.y + 8, 6, 6);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Courier';
                ctx.fillText('P1', p1.x + 4, p1.y - 6);
            }

            // Draw Player 2 (Green Soul Vibe)
            if (!p2.inVehicle) {
                ctx.fillStyle = p2.color;
                ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p2.x + (p2.facing > 0 ? 14 : 4), p2.y + 8, 6, 6);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Courier';
                ctx.fillText('P2', p2.x + 4, p2.y - 6);
            }

            // Draw Rising Lava (Mode 3)
            if (gameMode === 3) {
                ctx.fillStyle = 'rgba(239, 68, 68, 0.9)';
                ctx.fillRect(0, lavaY, WORLD_WIDTH, WORLD_HEIGHT - lavaY);
                ctx.fillStyle = '#fca5a5';
                ctx.fillRect(0, lavaY, WORLD_WIDTH, 8);
            }

            ctx.restore();
        }

        function mainLoop() {
            update();
            draw();
            requestAnimationFrame(mainLoop);
        }

        mainLoop();
    </script>
</body>
</html>
