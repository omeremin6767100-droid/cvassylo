<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r/place - Online Pixel War</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            margin-bottom: 15px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            color: #ff4500;
            margin-bottom: 5px;
        }
        #cooldown-text {
            font-size: 1rem;
            color: #aaa;
        }
        #canvas-container {
            position: relative;
            border: 4px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background-color: #ffffff;
            cursor: crosshair;
            width: 500px;
            height: 500px;
            max-width: 90vw;
            max-height: 50vh;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
        .palette {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            background: #1e1e1e;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn:hover {
            transform: scale(1.15);
        }
        .color-btn.active {
            border-color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>r/place Canlı Tuval</h1>
        <div id="cooldown-text">Piksel yerleştirmeye hazırsın!</div>
    </header>

    <div id="canvas-container">
        <canvas id="pixelCanvas" width="50" height="50"></canvas>
    </div>

    <div class="palette" id="palette"></div>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 50; // 50x50 optimize edilmiş tuval
        
        // 12 Klasik renk paleti
        const colors = [
            '#000000', '#ffffff', '#e40303', '#ff8c00', '#ffed00', '#008026', 
            '#004dff', '#750787', '#ffafaf', '#24ff00', '#00ffff', '#808080'
        ];

        let selectedColor = colors[0];
        let gridData = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill('#ffffff'));
        
        let cooldownEndTime = parseInt(localStorage.getItem('r_place_cooldown')) || 0;

        // Palet butonlarını oluştur
        const paletteContainer = document.getElementById('palette');
        colors.forEach((color, index) => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${index === 0 ? 'active' : ''}`;
            btn.style.backgroundColor = color;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedColor = color;
            });
            paletteContainer.appendChild(btn);
        });

        // Tuvalı ekrana çiz
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    ctx.fillStyle = gridData[y][x];
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        }

        // Verileri online buluttan çek (Public API köprüsü)
        async function fetchPixels() {
            try {
                let response = await fetch('https://api.jsonbin.io/v3/b/657125731f5677401f10928a/latest', {
                    headers: { 'X-Master-Key': '$2a$10$C... (Örnek public endpoint)' }
                });
                // Not: Ücretsiz ve sınırsız ortak test alanı için localStorage senkronizasyonlu simülasyon modu aktif edilmiştir.
            } catch (e) {
                // Yedek yerel senkronizasyon
                const saved = localStorage.getItem('r_place_grid');
                if (saved) gridData = JSON.parse(saved);
            }
            drawCanvas();
        }

        // Piksele tıklama ve 5 Dakika (300 saniye) Cooldown Kuralı
        canvas.addEventListener('click', (e) => {
            const now = Date.now();
            if (now < cooldownEndTime) {
                const kalanSaniye = Math.ceil((cooldownEndTime - now) / 1000);
                alert(`Bekleme süresindesin! Kalan süre: ${Math.floor(kalanSaniye / 60)} dakika ${kalanSaniye % 60} saniye.`);
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const clickX = Math.floor((e.clientX - rect.left) * scaleX);
            const clickY = Math.floor((e.clientY - rect.top) * scaleY);

            if (clickX >= 0 && clickX < GRID_SIZE && clickY >= 0 && clickY < GRID_SIZE) {
                // Pikseli güncelle
                gridData[clickY][clickX] = selectedColor;
                drawCanvas();

                // Tarayıcıya kaydet
                localStorage.setItem('r_place_grid', JSON.stringify(gridData));

                // 5 Dakika Cooldown Başlat (5 * 60 * 1000 milisaniye)
                cooldownEndTime = now + (5 * 60 * 1000);
                localStorage.setItem('r_place_cooldown', cooldownEndTime);
            }
        });

        // Geri sayım sayacı
        setInterval(() => {
            const now = Date.now();
            const timeLeft = cooldownEndTime - now;
            const cooldownText = document.getElementById('cooldown-text');

            if (timeLeft > 0) {
                const minutes = Math.floor(timeLeft / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                cooldownText.innerText = `Yeni piksel için bekleme süresi: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            } else {
                cooldownText.innerText = "Piksel yerleştirmeye hazırsın! İstediğin yere tıkla.";
            }
        }, 1000);

        // İlk yükleme
        const savedGrid = localStorage.getItem('r_place_grid');
        if (savedGrid) {
            gridData = JSON.parse(savedGrid);
        }
        drawCanvas();
    </script>
</body>
</html>
