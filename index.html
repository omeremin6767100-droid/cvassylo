<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvassylo - Mini Oyun Salonu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f111a;
            color: #fff;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
        }
        header h1 {
            font-size: 2.5rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        header p {
            color: #8b9bb4;
            margin-top: 10px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .game-card {
            background: #1a1d29;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2e43;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,255,204,0.2);
            border-color: #00ffcc;
        }
        .game-info {
            padding: 20px;
        }
        .game-info h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .game-info p {
            color: #8b9bb4;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .play-btn {
            display: inline-block;
            background: #00ffcc;
            color: #0f111a;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .play-btn:hover {
            background: #00cca3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cvassylo</h1>
        <p>En eğlenceli mini tarayıcı oyunları burada!</p>
    </header>

    <div class="container">
        <!-- Oyun 1 -->
        <div class="game-card">
            <div class="game-info">
                <h3>Hızlı Tıklayıcı</h3>
                <p>Süre bitmeden kaç kez tıklayabilirsin? Reflekslerini test et!</p>
                <a href="#" class="play-btn" onclick="alert('Yakında eklenecek!'); return false;">Oyna</a>
            </div>
        </div>

        <!-- Oyun 2 -->
        <div class="game-card">
            <div class="game-info">
                <h3>Renk Yakalama</h3>
                <p>Doğru rengi seçerek puanları topla, skoru patlat.</p>
                <a href="#" class="play-btn" onclick="alert('Yakında eklenecek!'); return false;">Oyna</a>
            </div>
        </div>

        <!-- Oyun 3 -->
        <div class="game-card">
            <div class="game-info">
                <h3>Piksel Labirent</h3>
                <p>Engellere çarpmadan çıkışa ulaşabilecek misin?</p>
                <a href="#" class="play-btn" onclick="alert('Yakında eklenecek!'); return false;">Oyna</a>
            </div>
        </div>
    </div>

</body>
</html>
