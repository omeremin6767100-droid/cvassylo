<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ücretsiz Oyun Mağazası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Menü (Navbar) */
        header {
            background-color: #161822;
            border-bottom: 1px solid #262938;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box input {
            background-color: #202330;
            border: 1px solid #32364a;
            color: #fff;
            padding: 10px 18px;
            border-radius: 25px;
            width: 280px;
            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        /* Vitrin Banner */
        .hero {
            background: linear-gradient(135deg, #1b1e2b 0%, #12141d 100%);
            margin: 30px 40px 10px 40px;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #2a2e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .hero-text h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero-text p {
            color: #a0a5b8;
            font-size: 16px;
            max-width: 550px;
        }

        .badge-free {
            background-color: #2ed573;
            color: #000;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 12px;
        }

        /* Oyun Listesi Alanı */
        main {
            padding: 20px 40px 50px 40px;
            flex: 1;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #e4e6eb;
            border-left: 4px solid #00d2ff;
            padding-left: 12px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 25px;
        }

        /* Oyun Kartı */
        .game-card {
            background-color: #181a24;
            border: 1px solid #272a3a;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #00d2ff;
        }

        .game-cover {
            height: 170px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
        }

        .status-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #ff9f43;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #ff9f43;
        }

        .game-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .game-desc {
            color: #9ba0b5;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
            flex: 1;
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #74798c;
            margin-bottom: 15px;
            padding-top: 12px;
            border-top: 1px solid #252836;
        }

        .download-btn {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            width: 100%;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        /* Özel Uyarı Penceresi (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-box {
            background: #1b1e2b;
            border: 1px solid #353a50;
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ff9f43;
        }

        .modal-msg {
            color: #c8cce0;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .modal-close {
            background: #2ed573;
            color: #000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #5c6175;
            font-size: 13px;
            border-top: 1px solid #1c1f2b;
        }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 15px; padding: 15px 20px; }
            .hero, main { margin: 15px 20px; padding: 20px; }
            .search-box input { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎮 <span>GAMEHUB</span> STORE</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Oyun ara..." onkeyup="filterGames()">
        </div>
    </header>

    <section class="hero">
        <div class="hero-text">
            <span class="badge-free">%100 ÜCRETSİZ ARŞİV</span>
            <h1>En Eğlenceli Oyunlar Tek Yerde</h1>
            <p>Seçtiğimiz en iyi çok oyunculu ve eğlenceli oyunları kolayca incele ve indir. Yeni oyunlar çok yakında eklenecek!</p>
        </div>
    </section>

    <main>
        <h2 class="section-title">Tüm Oyunlar</h2>
        <div class="games-grid" id="gamesGrid">
            <!-- Oyun kartları JavaScript ile buraya otomatik eklenir -->
        </div>
    </main>

    <!-- Uyarı Penceresi -->
    <div class="modal-overlay" id="alertModal" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-icon">⏳</div>
            <div class="modal-title" id="modalTitle">Gang Beasts</div>
            <div class="modal-msg" id="modalMessage">Daha gelmedi!</div>
            <button class="modal-close" onclick="closeModal()">Tamam</button>
        </div>
    </div>

    <footer>
        Ücretsiz Oyun İndirme Platformu &copy; 2026
    </footer>

    <script>
        // OYUN LİSTESİ (Yeni oyunları buraya ekleyebilirsin)
        const games = [
            {
                title: "Gang Beasts",
                category: "Parti / Çok Oyunculu",
                size: "2.1 GB",
                description: "Renkli ve pelte gibi karakterlerle arkadaşlarını ringden, çatılardan ve tehlikeli platformlardan aşağı atmaya çalıştığın eğlenceli dövüş oyunu.",
                bannerGradient: "linear-gradient(135deg, #ff4757, #ff6b81)",
                status: "YAKINDA",
                comingSoon: true, // true olduğu sürece tıklandığında "Daha gelmedi" yazar
                downloadUrl: "#"
            }
        ];

        const gamesGrid = document.getElementById('gamesGrid');

        function renderGames(list) {
            gamesGrid.innerHTML = "";
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-cover" style="background: ${game.bannerGradient};">
                        ${game.status ? `<span class="status-tag">${game.status}</span>` : ''}
                        ${game.title}
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-desc">${game.description}</div>
                        <div class="game-meta">
                            <span>Tür: ${game.category}</span>
                            <span>Boyut: ${game.size}</span>
                        </div>
                        <button class="download-btn" onclick="handleDownload('${game.title}', ${game.comingSoon}, '${game.downloadUrl}')">
                            İndir
                        </button>
                    </div>
                `;
                gamesGrid.appendChild(card);
            });
        }

        function handleDownload(title, isComingSoon, url) {
            if (isComingSoon) {
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalMessage').innerText = "Daha gelmedi!";
                document.getElementById('alertModal').style.display = 'flex';
            } else {
                window.open(url, '_blank');
            }
        }

        function closeModal() {
            document.getElementById('alertModal').style.display = 'none';
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(g => g.title.toLowerCase().includes(query));
            renderGames(filtered);
        }

        // Sayfa açıldığında oyunları listele
        renderGames(games);
    </script>
</body>
</html>
