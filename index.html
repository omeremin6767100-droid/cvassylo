<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvassylo - Ultimate Arcade Mini Oyun Salonu</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --accent: #00ffcc;
            --accent-hover: #00cca3;
            --text: #ffffff;
            --subtext: #8a99ad;
            --border: #232a3b;
        }

        .light-theme {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --accent: #0066ff;
            --accent-hover: #0052cc;
            --text: #1a1a1a;
            --subtext: #666666;
            --border: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text); padding: 20px; min-height: 100vh; }

        /* Top Bar & Header */
        header { text-align: center; padding: 20px 0 30px; position: relative; }
        header h1 { font-size: 3.2rem; color: var(--accent); text-shadow: 0 0 15px rgba(0,255,204,0.4); letter-spacing: 2px; }
        header p { color: var(--subtext); margin-top: 5px; font-size: 1.1rem; }
        
        .controls-bar {
            max-width: 1200px;
            margin: 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .search-box { flex: 1; min-width: 200px; }
        .search-box input {
            width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-color); color: var(--text); font-size: 1rem;
        }

        .filter-btn, .action-btn {
            background: var(--bg-color); color: var(--text); border: 1px solid var(--border);
            padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .filter-btn.active, .action-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        /* Grid */
        .container {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px; padding: 10px 0;
        }

        .game-card {
            background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            position: relative; overflow: hidden; height: 220px;
        }
        .game-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .game-card h3 { font-size: 1.2rem; margin-bottom: 6px; }
        .game-card p { color: var(--subtext); font-size: 0.85rem; line-height: 1.3; }
        .badge { position: absolute; top: 12px; right: 12px; font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; background: var(--accent); color: #000; font-weight: bold; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .play-btn { background: var(--accent); color: #000; padding: 8px 16px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; }
        .play-btn:hover { background: var(--accent-hover); }
        .like-btn { background: transparent; border: none; cursor: pointer; font-size: 1.2rem; color: var(--subtext); }

        /* Modal */
        #game-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 16px; border: 2px solid var(--accent); max-width: 500px; width: 90%; text-align: center; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: #ff4757; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .stats-panel { max-width: 1200px; margin: 20px auto; text-align: center; color: var(--subtext); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>CVASSYLO</h1>
        <p>30 Çılgın Mini Oyun & Devasa Eğlence Portalı</p>
    </header>

    <div class="controls-bar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Oyun ara..." onkeyup="filterGames()">
        </div>
        <div>
            <button class="filter-btn active" onclick="setFilter('all')">Tümü (30)</button>
            <button class="filter-btn" onclick="setFilter('action')">Aksiyon</button>
            <button class="filter-btn" onclick="setFilter('brain')">Zeka</button>
            <button class="filter-btn" onclick="setFilter('luck')">Şans</button>
        </div>
        <div>
            <button class="action-btn" onclick="playRandom()">🎲 Rastgele Oyun</button>
            <button class="action-btn" onclick="toggleTheme()">🌓 Tema</button>
        </div>
    </div>

    <div class="container" id="gamesGrid"></div>

    <div class="stats-panel">
        <span id="totalPlayed">Toplam Oynanma: 0</span> | <span id="totalScore">Kazanılan Puan: 0</span> | <span>Sürüm: v2.0 Poki Edition</span>
    </div>

    <div id="game-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeGame()">X Kapat</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // 30 Oyun Verisi
        const games = [
            { id: 1, title: "Hızlı Tıklayıcı", cat: "action", tag: "POPÜLER", desc: "5 saniyede kaç defa basabilirsin?" },
            { id: 2, title: "Renk Bulmaca", cat: "brain", tag: "ZOR", desc: "Hedef rengi en hızlı şekilde seç." },
            { id: 3, title: "Şans Kutusu", cat: "luck", tag: "ŞANS", desc: "Altın dolu gizli kutuyu yakala." },
            { id: 4, title: "Sayı Tahmin", cat: "brain", tag: "KLASİK", desc: "Aklımdan tuttuğum 1-20 arası sayıyı bul." },
            { id: 5, title: "Taş Kağıt Makas", cat: "action", tag: "POPÜLER", desc: "Yapay zekayı Taş-Kağıt-Makas ile yen." },
            { id: 6, title: "Şans Zarı", cat: "luck", tag: "YENİ", desc: "Zarları at, rakibinden daha yüksek getir." },
            { id: 7, title: "Matematik Canavarı", cat: "brain", tag: "EĞİTİM", desc: "Hızlı toplama işlemlerine cevap ver." },
            { id: 8, title: "Yazı Tura", cat: "luck", tag: "KOLAY", desc: "Parayı fırlat, doğru yüzü tahmin et." },
            { id: 9, title: "Hafıza Kartı", cat: "brain", tag: "BEĞENİLEN", desc: "Saklanan renk çiftlerini bulup eşleştir." },
            { id: 10, title: "Tepki Ölçer", cat: "action", tag: "REFLEKS", desc: "Ekran yeşile döndüğü milisaniyede tıkla!" },
            { id: 11, title: "Kelime Tahmin", cat: "brain", tag: "YENİ", desc: "Karışık harflerden doğru kelimeyi çıkar." },
            { id: 12, title: "Süratli Yazı", cat: "action", tag: "YENİ", desc: "Ekranda çıkan kelimeyi 3 saniyede yaz." },
            { id: 13, title: "Mayın Tarlası Mini", cat: "brain", tag: "TBR", desc: "Mayına basmadan güvenli bölgeyi seç." },
            { id: 14, title: "Renk Karıştırma", cat: "brain", tag: "YENİ", desc: "İki ana rengin karışımını doğru tahmin et." },
            { id: 15, title: "Çarpım Tablosu", cat: "brain", tag: "ZEKA", desc: "Rastgele gelen çarpma sorularını çöz." },
            { id: 16, title: "Para Katlama Slot", cat: "luck", tag: "SLOT", desc: "3 aynı simgeyi yan yana getir, skoru patlat." },
            { id: 17, title: "Refleks Balonu", cat: "action", tag: "HIZLI", desc: "Patlayan balonlara kaçırmadan tıkla." },
            { id: 18, title: "Hangi Sayı Büyük?", cat: "brain", tag: "KOLAY", desc: "İki işlemden hangisinin sonucu büyük?" },
            { id: 19, title: "Ters Kelime", cat: "brain", tag: "ZOR", desc: "Ters yazılan kelimenin doğrusunu bul." },
            { id: 20, title: "Kart Çekmece", cat: "luck", tag: "ŞANS", desc: "Daha yüksek değerli kartı çeken kazanır." },
            { id: 21, title: "Tam 5 Saniye", cat: "action", tag: "ZAMAN", desc: "Tam olarak 5.00. saniyede durdurabilir misin?" },
            { id: 22, title: "Labirent Çıkışı", cat: "brain", tag: "BULMACA", desc: "Doğru kapıyı seçerek labirentten çık." },
            { id: 23, title: "Bayrak Tahmin", cat: "brain", tag: "BİLGİ", desc: "Gösterilen başkentin hangi ülkeye ait olduğunu bul." },
            { id: 24, title: "Pixel Avı", cat: "action", tag: "DİKKAT", desc: "Ekranın neresinde belirdiğini görüp tıkla." },
            { id: 25, title: "Emoji Eşleştir", cat: "brain", tag: "EĞLENCE", desc: "Aynı iki emojiyi aynı anda aç." },
            { id: 26, title: "Tiz mi Bas mı?", cat: "brain", tag: "SES", desc: "Sayısal frekansı yüksek olan sesi bul." },
            { id: 27, title: "Tek mi Çift mi?", cat: "luck", tag: "KOLAY", desc: "Gelen rastgele sayı tek mi çift mi?" },
            { id: 28, title: "Ritm Yakalama", cat: "action", tag: "MÜZİK", desc: "Çember tam hizada kesişince tuşa bas." },
            { id: 29, title: "Renk-Yazı Tuzağı", cat: "brain", tag: "ODAK", desc: "Yazının anlamına değil, RENGİNE tıkla!" },
            { id: 30, title: "Zaman Çarkı", cat: "luck", tag: "ÇARK", desc: "Şans çarkını çevir ve büyük ikramiyeyi al." }
        ];

        let totalP = 0, totalS = 0;

        function renderGames(list) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            list.forEach(g => {
                grid.innerHTML += `
                    <div class="game-card">
                        <span class="badge">${g.tag}</span>
                        <div>
                            <h3>${g.title}</h3>
                            <p>${g.desc}</p>
                        </div>
                        <div class="card-footer">
                            <button class="play-btn" onclick="playGame(${g.id})">Oyna</button>
                            <button class="like-btn" onclick="this.style.color='#ff4757'">♥</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterGames() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderGames(games.filter(g => g.title.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q)));
        }

        function setFilter(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if(cat === 'all') renderGames(games);
            else renderGames(games.filter(g => g.cat === cat));
        }

        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        function playRandom() { playGame(Math.floor(Math.random() * games.length) + 1); }
        function closeGame() { document.getElementById('game-modal').style.display = 'none'; }

        function playGame(id) {
            totalP++;
            document.getElementById('totalPlayed').innerText = "Toplam Oynanma: " + totalP;
            const modal = document.getElementById('game-modal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';

            // Örnek oyun motorları altyapısı
            if(id === 1) {
                let score = 0, time = 5;
                body.innerHTML = `<h3>Hızlı Tıklayıcı</h3><p style="margin:15px;">Süre: <b id="t">5</b> | Skor: <b id="s">0</b></p><button class="play-btn" id="btn" style="padding:15px 30px;">TIKLA!</button>`;
                let b = document.getElementById('btn');
                b.onclick = () => { score++; document.getElementById('s').innerText = score; };
                let tm = setInterval(() => {
                    time--; document.getElementById('t').innerText = time;
                    if(time <= 0) { clearInterval(tm); b.disabled = true; b.innerText = "Bitti!"; addScore(score); }
                }, 1000);
            } else if(id === 5) {
                body.innerHTML = `<h3>Taş Kağıt Makas</h3><div style="margin:20px 0;"><button class="play-btn" onclick="tkm('Taş')">✊ Taş</button> <button class="play-btn" onclick="tkm('Kağıt')">✋ Kağıt</button> <button class="play-btn" onclick="tkm('Makas')">✌️ Makas</button></div><div id="res"></div>`;
            } else if(id === 21) {
                let start = Date.now();
                body.innerHTML = `<h3>Tam 5.00 Saniyede Durdur!</h3><p style="margin:20px 0;">Butona bastığın an sayac başlar, 5.00 sn olduğunu düşündüğünde tekrar bas!</p><button class="play-btn" id="sbtn">DURDUR!</button><h2 id="sres" style="margin-top:15px;"></h2>`;
                document.getElementById('sbtn').onclick = () => {
                    let diff = ((Date.now() - start) / 1000).toFixed(2);
                    document.getElementById('sres').innerText = diff + " Saniye!";
                    addScore(Math.abs(5 - diff) < 0.2 ? 100 : 10);
                };
            } else {
                body.innerHTML = `<h3>${games[id-1].title}</h3><p style="margin:20px 0;">Oyun Başlatıldı! Oyna ve skor kazan.</p><button class="play-btn" onclick="addScore(50); closeGame();">Kazan (50 Puan)</button>`;
            }
        }

        function tkm(user) {
            let opts = ['Taş', 'Kağıt', 'Makas'];
            let bot = opts[Math.floor(Math.random()*3)];
            let res = document.getElementById('res');
            if(user === bot) res.innerText = "Berabere! Bot da " + bot + " yaptı.";
            else if((user==='Taş'&&bot==='Makas')||(user==='Kağıt'&&bot==='Taş')||(user==='Makas'&&bot==='Kağıt')) {
                res.innerText = "KAZANDIN! Bot: " + bot; addScore(30);
            } else res.innerText = "Kaybettin! Bot: " + bot;
        }

        function addScore(pts) {
            totalS += pts;
            document.getElementById('totalScore').innerText = "Kazanılan Puan: " + totalS;
        }

        // Başlangıç çalıştırması
        renderGames(games);
    </script>
</body>
</html>
