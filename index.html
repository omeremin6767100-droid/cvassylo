<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cvassylo - Oyun Mağazası</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1015; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #161822; border-bottom: 1px solid #262938; padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 1px; color: #ffffff; display: flex; align-items: center; gap: 10px; }
        .logo span { background: linear-gradient(90deg, #ff4757, #ff6b81); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-box input { background-color: #202330; border: 1px solid #32364a; color: #fff; padding: 10px 18px; border-radius: 25px; width: 280px; outline: none; }
        .hero { background: linear-gradient(135deg, #1b1e2b 0%, #12141d 100%); margin: 30px 40px 10px 40px; padding: 40px; border-radius: 16px; border: 1px solid #2a2e42; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .hero p { color: #a0a5b8; font-size: 16px; max-width: 550px; }
        main { padding: 20px 40px 50px 40px; flex: 1; }
        .section-title { font-size: 20px; margin-bottom: 20px; color: #e4e6eb; border-left: 4px solid #ff4757; padding-left: 12px; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 25px; }
        .game-card { background-color: #181a24; border: 1px solid #272a3a; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
        .game-cover { height: 170px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; position: relative; }
        .status-tag { position: absolute; top: 12px; right: 12px; background-color: rgba(0, 0, 0, 0.75); color: #2ed573; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid #2ed573; }
        .game-info { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .game-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .game-desc { color: #9ba0b5; font-size: 14px; line-height: 1.5; margin-bottom: 18px; flex: 1; }
        .game-meta { display: flex; justify-content: space-between; font-size: 12px; color: #74798c; margin-bottom: 15px; padding-top: 12px; border-top: 1px solid #252836; }
        .download-btn { background: linear-gradient(90deg, #ff4757, #ff6b81); color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; }
        .download-btn:hover { opacity: 0.9; }
        footer { text-align: center; padding: 20px; color: #5c6175; font-size: 13px; border-top: 1px solid #1c1f2b; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎮 <span>cvassylo</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Oyun ara..." onkeyup="filterGames()">
        </div>
    </header>

    <section class="hero">
        <h1>cvassylo Oyun Mağazasına Hoş Geldin</h1>
        <p>En sevdiğin oyunları tek tıkla indirebileceğin kişisel platformun.</p>
    </section>

    <main>
        <h2 class="section-title">Mevcut Oyunlar</h2>
        <div class="games-grid" id="gamesGrid"></div>
    </main>

    <footer>cvassylo Oyun Platformu &copy; 2026</footer>

    <script>
        const games = [
            {
                title: "Gang Beasts",
                category: "Parti / Çok Oyunculu",
                size: "2.1 GB",
                description: "Renkli ve pelte gibi karakterlerle arkadaşlarını ringden aşağı atmaya çalıştığın eğlenceli dövüş oyunu.",
                bannerGradient: "linear-gradient(135deg, #ff4757, #ff6b81)",
                status: "İNDİR",
                downloadUrl: "#" // Buraya doğrudan dosya indirme linkini yazabilirsin
            }
        ];

        const gamesGrid = document.getElementById('gamesGrid');

        function renderGames(list) {
            gamesGrid.innerHTML = "";
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-cover" style="background: ${game.bannerGradient};">
                        <span class="status-tag">${game.status}</span>
                        ${game.title}
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-desc">${game.description}</div>
                        <div class="game-meta">
                            <span>Tür: ${game.category}</span>
                            <span>Boyut: ${game.size}</span>
                        </div>
                        <button class="download-btn" onclick="window.open('${game.downloadUrl}', '_blank')">Hemen İndir</button>
                    </div>
                `;
                gamesGrid.appendChild(card);
            });
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderGames(games.filter(g => g.title.toLowerCase().includes(query)));
        }

        renderGames(games);
    </script>
</body>
</html>
