<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cvassylo - Terraria Style Daylight Open World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: #87CEEB;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        header {
            width: 100%;
            background-color: #ffffff;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #cbd5e1;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #0284c7;
            letter-spacing: 3px;
        }

        .logo span {
            color: #16a34a;
        }

        .mode-container {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            background-color: #f1f5f9;
            color: #475569;
            border: 2px solid #cbd5e1;
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .mode-btn.active, .mode-btn:hover {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 10px rgba(2,132,199,0.4);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #e0f2fe 100%);
        }

        canvas {
            background-color: #87CEEB;
            display: block;
            border: 4px solid #0284c7;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 30px;
            background: rgba(255, 255, 255, 0.9);
            padding: 14px 22px;
            border: 2px solid #94a3b8;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            line-height: 1.7;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .controls-hint {
            position: absolute;
            bottom: 14px;
            font-size: 12px;
            color: #334155;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.85);
            padding: 5px 15px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">cvassylo<span>.</span>terraria</div>
        <div class="mode-container">
            <button class="mode-btn active" onclick="switchMode(1)">1. Açık Dünya</button>
            <button class="mode-btn" onclick="switchMode(2)">2. NPC Kaçış</button>
            <button class="mode-btn" onclick="switchMode(3)">3. Yükselen Lav</button>
            <button class="mode-btn" onclick="switchMode(4)">4. Altın Avı</button>
            <button class="mode-btn" onclick="switchMode(5)">5. Zombi Kuşatması</button>
        </div>
    </header>

    <main>
        <div class="hud-overlay" id="hud">Mod: Açık Dünya<br>P1 Can: ❤️❤️❤️ | P2 Can: ❤️❤️❤️<br>Skor: 0</div>
        <canvas id="gameCanvas" width="1152" height="648"></canvas>
        <div class="controls-hint">P1: WASD + Space + F (Araca Bin) | P2: Yön Tuşları + Yukarı Ok + G (Araca Bin)</div>
    </main>

    <script>
        // ==========================================
        // 1. WEB AUDIO API - RETRO SOUNDS
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(950, now + 0.08);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        // ==========================================
        // 2. CANVAS & WORLD CONFIGURATION
        // ==========================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        const WORLD_WIDTH = 7000;
        const WORLD_HEIGHT = 1600;
        const GRAVITY = 0.55;

        let gameMode = 1;
        let gameScore = 0;
        let lavaY = WORLD_HEIGHT + 300;

        // Particle System
        let particles = [];
        function spawnParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 25 + Math.random() * 15,
                    color: color,
                    size: 3 + Math.random() * 3
                });
            }
        }

        // Input Management
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
            if (e.code === 'KeyF') interactVehicle(p1);
            if (e.code === 'KeyG') interactVehicle(p2);
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // ==========================================
        // 3. PLAYERS & TERRARIA STYLE ENVIRONMENT
        // ==========================================
        const p1 = {
            x: 200, y: 1200, w: 26, h: 40, vx: 0, vy: 0,
            speed: 4.5, jumpForce: -13, grounded: false, color: '#0284c7',
            hp: 3, inVehicle: null, facing: 1, name: 'P1'
        };

        const p2 = {
            x: 260, y: 1200, w: 26, h: 40, vx: 0, vy: 0,
            speed: 4.5, jumpForce: -13, grounded: false, color: '#16a34a',
            hp: 3, inVehicle: null, facing: 1, name: 'P2'
        };

        // Terraria tarzı arazi: Zemin, Çim tepeler, Şirin evler ve geçilebilir platformlar
        const platforms = [];
        platforms.push({ x: 0, y: 1400, w: WORLD_WIDTH, h: 200, type: 'ground', color: '#15803d' });

        // Tepeler, şirin evler ve doğal platformlar
        for (let i = 300; i < WORLD_WIDTH - 400; i += 380) {
            let isHouse = (i % 760 === 0);
            if (isHouse) {
                // Şirin Ahşap Ev (Üzerine zıplanabilir, engellemez)
                platforms.push({ x: i, y: 1300, w: 140, h: 100, type: 'house', color: '#b45309', roof: '#dc2626' });
            } else {
                // Doğal Toprak/Çimen Tepesi veya Platform
                let pWidth = 200 + ((i * 7) % 100);
                platforms.push({ x: i, y: 1400 - 60 - ((i * 11) % 120), w: pWidth, h: 25, type: 'platform', color: '#16a34a' });
            }
        }

        // Gökyüzü bulut üstü adacıklar
        for (let i = 200; i < WORLD_WIDTH; i += 350) {
            platforms.push({ x: i, y: 500 + ((i * 13) % 400), w: 150, h: 20, type: 'platform', color: '#ca8a04' });
        }

        // Sürülebilir Araba/Bugi
        const vehicles = [
            { x: 700, y: 1360, w: 70, h: 35, vx: 0, speed: 6, color: '#ea580c', driver: null },
            { x: 2500, y: 1360, w: 70, h: 35, vx: 0, speed: 6, color: '#9333ea', driver: null }
        ];

        // NPC ve Zombiler
        const entities = [];
        for (let i = 0; i < 30; i++) {
            entities.push({
                x: 400 + i * 180,
                y: 1360,
                w: 26, h: 40,
                vx: (Math.random() - 0.5) * 2,
                type: (i % 2 === 0) ? 'enemy' : 'npc',
                hp: 2
            });
        }

        // Altın Paralar
        const coins = [];
        for (let i = 250; i < WORLD_WIDTH - 200; i += 200) {
            coins.push({ x: i, y: 450 + ((i * 9) % 700), collected: false });
        }

        // Ağaçlar ve Çiçekler (Dekoratif)
        const decorations = [];
        for (let i = 150; i < WORLD_WIDTH; i += 220) {
            decorations.push({ x: i + Math.random() * 40, y: 1400, type: (i % 2 === 0) ? 'tree' : 'flower' });
        }

        // ==========================================
        // 4. GAME MODES & SYSTEM
        // ==========================================
        function switchMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
                if (idx + 1 === mode) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (mode === 3) lavaY = WORLD_HEIGHT + 300;
            updateHUD();
        }

        function updateHUD() {
            let titles = ["Açık Dünya", "NPC Kaçış", "Yükselen Lav", "Altın Avı", "Zombi Kuşatması"];
            document.getElementById('hud').innerHTML = `Mod: ${titles[gameMode-1]}<br>P1 Can: ${'❤️'.repeat(Math.max(0,p1.hp))} | P2 Can: ${'❤️'.repeat(Math.max(0,p2.hp))}<br>Skor: ${gameScore}`;
        }

        function interactVehicle(player) {
            if (player.inVehicle) {
                player.x = player.inVehicle.x + 80;
                player.y = player.inVehicle.y;
                player.inVehicle.driver = null;
                player.inVehicle = null;
            } else {
                vehicles.forEach(v => {
                    if (!v.driver && Math.hypot(v.x - player.x, v.y - player.y) < 70) {
                        v.driver = player;
                        player.inVehicle = v;
                    }
                });
            }
        }

        // ==========================================
        // 5. PHYSICS & COLLISIONS
        // ==========================================
        function rectIntersect(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        function updatePlayer(p, leftKey, rightKey, jumpKey) {
            if (p.inVehicle) {
                let v = p.inVehicle;
                if (keys[leftKey]) { v.x -= v.speed; v.facing = -1; }
                if (keys[rightKey]) { v.x += v.speed; v.facing = 1; }
                p.x = v.x + v.w / 2;
                p.y = v.y - 12;
                return;
            }

            p.vx = 0;
            if (keys[leftKey]) { p.vx = -p.speed; p.facing = -1; }
            if (keys[rightKey]) { p.vx = p.speed; p.facing = 1; }

            p.x += p.vx;
            platforms.forEach(plat => {
                if (plat.type !== 'house' && rectIntersect(p, plat)) {
                    if (p.vx > 0) p.x = plat.x - p.w;
                    else if (p.vx < 0) p.x = plat.x + plat.w;
                }
            });

            p.vy += GRAVITY;
            p.y += p.vy;
            p.grounded = false;

            platforms.forEach(plat => {
                if (rectIntersect(p, plat)) {
                    if (p.vy > 0 && p.y + p.h - p.vy <= plat.y + 10) {
                        p.y = plat.y - p.h;
                        p.vy = 0;
                        p.grounded = true;
                    }
                }
            });

            if (keys[jumpKey] && p.grounded) {
                p.vy = p.jumpForce;
                p.grounded = false;
                playSound('jump');
                spawnParticles(p.x + p.w/2, p.y + p.h, p.color, 5);
            }

            if (p.x < 0) p.x = 0;
            if (p.x > WORLD_WIDTH - p.w) p.x = WORLD_WIDTH - p.w;
            if (p.y > WORLD_HEIGHT) {
                p.hp--;
                p.y = 800; p.x = 200;
                playSound('hit');
                updateHUD();
            }
        }

        // ==========================================
        // 6. UPDATE LOOP
        // ==========================================
        function update() {
            if (gameMode === 3) {
                lavaY -= 0.4;
                if (p1.y > lavaY) { p1.hp--; p1.y = 300; playSound('hit'); updateHUD(); }
                if (p2.y > lavaY) { p2.hp--; p2.y = 300; playSound('hit'); updateHUD(); }
            }

            updatePlayer(p1, 'KeyA', 'KeyD', 'Space');
            updatePlayer(p2, 'ArrowLeft', 'ArrowRight', 'ArrowUp');

            entities.forEach(en => {
                en.x += en.vx;
                if (en.x < 100 || en.x > WORLD_WIDTH - 100) en.vx *= -1;

                if (gameMode === 2 || gameMode === 5) {
                    let target = Math.hypot(p1.x - en.x, p1.y - en.y) < Math.hypot(p2.x - en.x, p2.y - en.y) ? p1 : p2;
                    if (en.x < target.x) en.x += 1.3;
                    else en.x -= 1.3;

                    if (rectIntersect(p1, en)) { p1.hp -= 0.04; updateHUD(); }
                    if (rectIntersect(p2, en)) { p2.hp -= 0.04; updateHUD(); }
                }
            });

            coins.forEach(c => {
                if (!c.collected) {
                    if (Math.hypot(p1.x - c.x, p1.y - c.y) < 28 || Math.hypot(p2.x - c.x, p2.y - c.y) < 28) {
                        c.collected = true;
                        gameScore += 10;
                        playSound('coin');
                        spawnParticles(c.x, c.y, '#eab308', 8);
                        updateHUD();
                    }
                }
            });

            particles.forEach((pt, idx) => {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
                if (pt.life <= 0) particles.splice(idx, 1);
            });
        }

        // ==========================================
        // 7. RENDER ENGINE (DAYLIGHT TERRARIA VIBE)
        // ==========================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let camX = (p1.x + p2.x) / 2 - canvas.width / 2;
            let camY = (p1.y + p2.y) / 2 - canvas.height / 2;

            camX = Math.max(0, Math.min(camX, WORLD_WIDTH - canvas.width));
            camY = Math.max(0, Math.min(camY, WORLD_HEIGHT - canvas.height));

            ctx.save();
            ctx.translate(-camX, -camY);

            // Gündüz Gökyüzü ve Güneş
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(camX, camY, canvas.width, canvas.height);

            // Parlayan Güneş
            ctx.fillStyle = '#fde047';
            ctx.beginPath(); ctx.arc(camX + 900, camY + 120, 50, 0, Math.PI*2); ctx.fill();

            // Hareketli Bulutlar
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 40; i++) {
                let cx = (i * 450) % WORLD_WIDTH;
                let cy = 80 + (i * 70) % 250;
                ctx.fillRect(cx, cy, 90, 35);
                ctx.fillRect(cx + 20, cy - 15, 50, 25);
            }

            // Platformlar ve Zeminler
            platforms.forEach(plat => {
                ctx.fillStyle = plat.color;
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                if (plat.type === 'house') {
                    // Çatı
                    ctx.fillStyle = plat.roof;
                    ctx.beginPath();
                    ctx.moveTo(plat.x - 10, plat.y);
                    ctx.lineTo(plat.x + plat.w/2, plat.y - 50);
                    ctx.lineTo(plat.x + plat.w + 10, plat.y);
                    ctx.fill();
                    // Kapı
                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(plat.x + plat.w/2 - 15, plat.y + plat.h - 40, 30, 40);
                }
            });

            // Dekoratif Ağaçlar ve Çiçekler
            decorations.forEach(dec => {
                if (dec.type === 'tree') {
                    ctx.fillStyle = '#9a3412';
                    ctx.fillRect(dec.x, dec.y - 60, 14, 60);
                    ctx.fillStyle = '#16a34a';
                    ctx.beginPath(); ctx.arc(dec.x + 7, dec.y - 70, 28, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = '#ec4899';
                    ctx.fillRect(dec.x, dec.y - 12, 10, 10);
                }
            });

            // Altın Paralar
            ctx.fillStyle = '#eab308';
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillRect(c.x - 6, c.y - 6, 12, 12);
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(c.x - 2, c.y - 2, 4, 4);
                    ctx.fillStyle = '#eab308';
                }
            });

            // Araçlar
            vehicles.forEach(v => {
                ctx.fillStyle = v.color;
                ctx.fillRect(v.x, v.y, v.w, v.h);
                ctx.fillStyle = '#bae6fd';
                ctx.fillRect(v.x + 15, v.y - 10, 30, 12);
                ctx.fillStyle = '#000';
                ctx.fillRect(v.x + 8, v.y + v.h - 4, 12, 10);
                ctx.fillRect(v.x + v.w - 20, v.y + v.h - 4, 12, 10);
            });

            // NPC / Zombiler
            entities.forEach(en => {
                ctx.fillStyle = (gameMode === 5) ? '#15803d' : '#64748b';
                ctx.fillRect(en.x, en.y, en.w, en.h);
                ctx.fillStyle = '#000';
                ctx.fillRect(en.x + 6, en.y + 10, 4, 4);
                ctx.fillRect(en.x + 16, en.y + 10, 4, 4);
            });

            // Oyuncu 1
            if (!p1.inVehicle) {
                ctx.fillStyle = p1.color;
                ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p1.x + (p1.facing > 0 ? 15 : 5), p1.y + 10, 6, 6);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px Courier';
                ctx.fillText('P1', p1.x + 4, p1.y - 6);
            }

            // Oyuncu 2
            if (!p2.inVehicle) {
                ctx.fillStyle = p2.color;
                ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p2.x + (p2.facing > 0 ? 15 : 5), p2.y + 10, 6, 6);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px Courier';
                ctx.fillText('P2', p2.x + 4, p2.y - 6);
            }

            // Parçacıklar
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            });

            // Yükselen Lav (Mod 3)
            if (gameMode === 3) {
                ctx.fillStyle = 'rgba(239, 68, 68, 0.9)';
                ctx.fillRect(0, lavaY, WORLD_WIDTH, WORLD_HEIGHT - lavaY);
                ctx.fillStyle = '#fca5a5';
                ctx.fillRect(0, lavaY, WORLD_WIDTH, 8);
            }

            ctx.restore();
        }

        function mainLoop() {
            update();
            draw();
            requestAnimationFrame(mainLoop);
        }

        mainLoop();
    </script>
</body>
</html>
