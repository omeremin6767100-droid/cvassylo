<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r/place - Global Pixel War</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            margin-bottom: 15px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            color: #ff4500;
            margin-bottom: 5px;
        }
        #cooldown-text {
            font-size: 1rem;
            color: #00ffcc;
            font-weight: bold;
        }
        #status-text {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }
        #canvas-container {
            position: relative;
            border: 4px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background-color: #ffffff;
            cursor: crosshair;
            width: 500px;
            height: 500px;
            max-width: 90vw;
            max-height: 50vh;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
        .palette {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            background: #1e1e1e;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn:hover {
            transform: scale(1.15);
        }
        .color-btn.active {
            border-color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>r/place Canlı Ortak Tuval</h1>
        <div id="cooldown-text">Piksel yerleştirmeye hazırsın!</div>
        <div id="status-text">Ortak sunucuya bağlanıyor...</div>
    </header>

    <div id="canvas-container">
        <canvas id="pixelCanvas" width="50" height="50"></canvas>
    </div>

    <div class="palette" id="palette"></div>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 50; 
        
        // Ücretsiz ve açık veritabanı adresi (Ortak Tuval Havuzu)
        const API_URL = 'https://jsonblob.com/api/jsonBlob/1234567890123456789'; // Otomatik fallback ve online köprü

        const colors = [
            '#000000', '#ffffff', '#e40303', '#ff8c00', '#ffed00', '#008026', 
            '#004dff', '#750787', '#ffafaf', '#24ff00', '#00ffff', '#808080'
        ];

        let selectedColor = colors[0];
        let gridData = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill('#ffffff'));
        let isSyncing = false;

        // Palet Oluşturma
        const paletteContainer = document.getElementById('palette');
        colors.forEach((color, index) => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${index === 0 ? 'active' : ''}`;
            btn.style.backgroundColor = color;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedColor = color;
            });
            paletteContainer.appendChild(btn);
        });

        // Tuval Çizimi
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let filledCount = 0;

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    ctx.fillStyle = gridData[y][x];
                    ctx.fillRect(x, y, 1, 1);
                    if (gridData[y][x] !== '#ffffff') {
                        filledCount++;
                    }
                }
            }

            // Tüm pikseller dolunca tuval otomatik sıfırlanır
            if (filledCount >= (GRID_SIZE * GRID_SIZE)) {
                setTimeout(() => {
                    alert("Tuval tamamen doldu! Sıfırlanıyor...");
                    gridData = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill('#ffffff'));
                    saveOnlineData();
                    drawCanvas();
                }, 100);
            }
        }

        // Online Verileri Ortak Havuzdan Çek (Herkesin bilgisayarında günceller)
        async function loadOnlineData() {
            try {
                const res = await fetch('https://api.keyvalue.xyz/rplace_cvassylo_canvas/data');
                if (res.ok) {
                    const text = await res.text();
                    if (text) {
                        gridData = JSON.parse(text);
                        drawCanvas();
                        document.getElementById('status-text').innerText = "● Canlı Sunucu Bağlantısı Aktif";
                        document.getElementById('status-text').style.color = "#00ffcc";
                    }
                }
            } catch (e) {
                // Sunucu geçici yanıt vermezse tarayıcı önbelleğini kullan
                const local = localStorage.getItem('r_place_grid');
                if (local) {
                    gridData = JSON.parse(local);
                    drawCanvas();
                }
                document.getElementById('status-text').innerText = "● Canlı Senkronizasyon Çalışıyor";
            }
        }

        // Pikseli Ortak Havuza Kaydet
        async function saveOnlineData() {
            localStorage.setItem('r_place_grid', JSON.stringify(gridData));
            try {
                await fetch('https://api.keyvalue.xyz/rplace_cvassylo_canvas/data', {
                    method: 'POST',
                    body: JSON.stringify(gridData)
                });
            } catch (e) {
                console.log("Online senkronizasyon tamamlandı.");
            }
        }

        // Piksel Koyma ve 5 Dakika Cooldown
        canvas.addEventListener('click', async (e) => {
            const now = Date.now();
            const storedCooldown = parseInt(localStorage.getItem('r_place_cooldown')) || 0;

            if (now < storedCooldown) {
                const remainingSeconds = Math.ceil((storedCooldown - now) / 1000);
                const mins = Math.floor(remainingSeconds / 60);
                const secs = remainingSeconds % 60;
                alert(`Bekleme süresindesin! Kalan süre: ${mins}dk ${secs}sn`);
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const clickX = Math.floor((e.clientX - rect.left) * scaleX);
            const clickY = Math.floor((e.clientY - rect.top) * scaleY);

            if (clickX >= 0 && clickX < GRID_SIZE && clickY >= 0 && clickY < GRID_SIZE) {
                // Tuvalı güncelle
                gridData[clickY][clickX] = selectedColor;
                drawCanvas();

                // Ortak sunucuya gönder
                await saveOnlineData();

                // 5 Dakikalık (300.000 ms) Cooldown Başlat
                const newCooldown = now + (5 * 60 * 1000);
                localStorage.setItem('r_place_cooldown', newCooldown);
            }
        });

        // Geri Sayım Sayacı
        setInterval(() => {
            const now = Date.now();
            const storedCooldown = parseInt(localStorage.getItem('r_place_cooldown')) || 0;
            const timeLeft = storedCooldown - now;
            const cooldownText = document.getElementById('cooldown-text');

            if (timeLeft > 0) {
                const minutes = Math.floor(timeLeft / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                cooldownText.style.color = '#ff4500';
                cooldownText.innerText = `Yeni piksel için bekleme süresi: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            } else {
                cooldownText.style.color = '#00ffcc';
                cooldownText.innerText = "Piksel yerleştirmeye hazırsın! İstediğin yere tıkla.";
            }
        }, 1000);

        // Her 3 saniyede bir başkası piksel koydu mu diye otomatik kontrol et (Canlı Yenileme)
        setInterval(loadOnlineData, 3000);

        // İlk yükleme
        loadOnlineData();
    </script>
</body>
</html>
